<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
    <header th:fragment="navbar">
        <nav>
            <div>
                <span>Eco Solicitud</span>
            </div>
            
            <div>
                <a th:href="@{/}">Inicio</a>
                
                <!-- Enlaces para usuarios autenticados -->
                <div th:if="${session.user != null}">
                    <span th:text="${session.user.username}">Usuario</span>
                    <a th:href="@{/user/dashboard}">Dashboard</a>
                    <a th:if="${session.user.role == 'ADMIN'}" th:href="@{/admin}">Administración</a>
                    <a th:href="@{/auth/logout}">Cerrar sesión</a>
                </div>
                
                <!-- Enlaces para usuarios no autenticados -->
                <div th:if="${session.user == null}">
                    <a th:href="@{/auth/login}">Iniciar sesión</a>
                    <a th:href="@{/auth/register}">Registrarse</a>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
