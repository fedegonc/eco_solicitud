<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Inicio</title>
</head>
<body>
<div layout:fragment="content">

    <div>
        <div>
            <h1>Eco Solicitud</h1>
        </div>
        <div>
            <h2 th:text="${mensaje}">Mensaje de bienvenida</h2>
            <p>
                Plataforma ecológica para la gestión de solicitudes ambientales, desarrollada con tecnologías modernas y un compromiso con la sostenibilidad.
            </p>
            
            <div>
                <a th:href="@{/auth/login}" th:unless="${session.usuario}">
                    Iniciar Sesión
                </a>
                <a th:href="@{/auth/register}" th:unless="${session.usuario}">
                    Registrarse
                </a>
                
                <a th:href="@{/admin}" th:if="${session.isAdmin}">
                    Panel de Administración
                </a>
            </div>
        </div>
    </div>
    
    
</div>
</body>
</html>
